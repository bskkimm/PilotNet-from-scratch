[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotnet-from-scratch"
version = "0.0.0"
description = "A clean reimplementation of NVIDIA PilotNet."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bskkimm" }]
dependencies = ["numpy>=1.24", "pillow>=10.0", "torch>=2.2", "torchvision>=0.17"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
nuscenes = ["nuscenes-devkit>=1.1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
